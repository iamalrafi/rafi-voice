      - name: Download the offline speech model (about 40 MB)
        working-directory: proj
        run: |
          curl -fL --retry 5 --retry-delay 5 -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q model.zip
          mkdir -p app/src/main/assets
          rm -rf app/src/main/assets/model-en-us
          mv vosk-model-small-en-us-0.15 app/src/main/assets/model-en-us
          ls app/src/main/assets/model-en-us

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build the APK
        working-directory: proj
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: VoiceControl-APK
          path: proj/app/build/outputs/apk/debug/app-debug.apk
