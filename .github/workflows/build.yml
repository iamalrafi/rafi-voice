      - name: Download the offline speech model (about 40 MB)
        working-directory: proj
        run: |
          curl -fL --retry 5 --retry-delay 5 -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q model.zip
          mkdir -p app/src/main/assets
          rm -rf app/src/main/assets/model-en-us
          mv vosk-model-small-en-us-0.15 app/src/main/assets/model-en-us
          ls app/src/main/assets/model-en-us

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build the APK
        working-directory: proj
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Publish a GitHub Release with the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp proj/app/build/outputs/apk/release/app-release.apk VoiceControl.apk
          gh release create "v${{ github.run_number }}" VoiceControl.apk --repo "${{ github.repository }}" --title "Voice Control v${{ github.run_number }}" --notes "Download VoiceControl.apk and install it on your phone." --latest

      - uses: actions/upload-artifact@v4
        with:
          name: VoiceControl-APK
          path: proj/app/build/outputs/apk/release/app-release.apk
